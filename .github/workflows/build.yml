# Build + unit tests: Windows Release (the shipped configuration) and a lean
# macOS Debug build (jassert enabled, so JUCE assertions show up in the logs;
# no AI / FFmpeg: those runtimes are vendored for Windows only).
#
# Lean builds (-DSPECTRO_ENABLE_AI=OFF): the AI tests download model weights on
# first use, which a CI runner should not depend on. Every other dependency
# (JUCE, SoXR, SoundTouch, FFmpeg) is vendored under extern/.
#
# Only the app target is built: it embeds the unit suite (--run-unit-tests,
# which is what ctest runs) and depends on the fake recorder plugin the
# recording tests load (tests/CMakeLists.txt). The console SpectroCraftTests
# target would compile UnitTests.cpp and src/ a second time for nothing.
#
# ctest runs the suite as SC_TEST_SHARDS parallel processes (one per CPU of
# the configuring machine, see tests/CMakeLists.txt); -j lets them overlap.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (pull_request only; branch pushes other than main do not
# trigger), a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DSPECTRO_ENABLE_AI=OFF

      - name: Build (Release, app + fake recorder plugin)
        run: cmake --build build --config Release --target SpectroCraft --parallel

      - name: Unit tests (parallel shards)
        run: ctest --test-dir build -C Release -j $env:NUMBER_OF_PROCESSORS --output-on-failure

      - name: Upload app (Windows x64, Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # SpectroCraft.exe + FFmpeg DLLs + recorders/wasapi_recorder.dll.
          # Lean build: no AI noise suppression / transcription (OpenVINO, whisper).
          name: SpectroCraft-windows-x64
          path: |
            build/src/SpectroCraft_artefacts/Release/
            !build/src/SpectroCraft_artefacts/Release/**/*.pdb
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Windows with the AI features (OpenVINO noise suppression, whisper.cpp
  # transcription): the configuration that ships in bin/Release. The runtime
  # DLLs are vendored there and copied next to the exe; model weights are not
  # shipped - the app downloads them on first use (tests download them into
  # %APPDATA%/SpectroCraft/models, cached between runs).
  windows-ai:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache AI model weights
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\SpectroCraft\models
          key: sc-models-${{ hashFiles('src/AI/ModelManager.cpp') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DSPECTRO_ENABLE_AI=ON

      - name: Build (Release, app + fake recorder plugin)
        run: cmake --build build --config Release --target SpectroCraft --parallel

      # -j 1: shards in turn, so two processes never download the same model
      # file at the same time.
      - name: Unit tests (shards in turn, AI tests included)
        run: ctest --test-dir build -C Release -j 1 --output-on-failure

      - name: Upload app (Windows x64, Release, with AI)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # SpectroCraft.exe + OpenVINO / whisper.cpp / FFmpeg DLLs + recorders/.
          name: SpectroCraft-windows-x64-ai
          path: |
            build/src/SpectroCraft_artefacts/Release/
            !build/src/SpectroCraft_artefacts/Release/**/*.pdb
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows-ai
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  macos-debug:
    runs-on: macos-15   # Xcode 16: AppleClang 15 (macos-14) rejects the menu-ID enumerators in comparisons
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSPECTRO_ENABLE_AI=OFF
          -DSPECTRO_ENABLE_FFMPEG=OFF

      - name: Build (Debug, app + fake recorder plugin)
        run: cmake --build build --target SpectroCraft --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests (parallel shards)
        run: ctest --test-dir build -j "$(sysctl -n hw.ncpu)" --output-on-failure

      # tar first: upload-artifact zips drop the executable bit of the app.
      - name: Package app (macOS arm64)
        if: success()
        run: tar -czf SpectroCraft-macos-arm64.tar.gz -C build/src/SpectroCraft_artefacts/Debug SpectroCraft.app

      - name: Upload app (macOS arm64, Debug, unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpectroCraft-macos-arm64
          path: SpectroCraft-macos-arm64.tar.gz
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-macos-debug
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Linux: lean Debug build (no AI / FFmpeg), tests under a virtual X display.
  # JUCE's Linux dependencies: ALSA, FreeType/fontconfig, X11 extensions, GL.
  linux-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libegl-dev libgl-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSPECTRO_ENABLE_AI=OFF
          -DSPECTRO_ENABLE_FFMPEG=OFF

      - name: Build (Debug, app + fake recorder plugin)
        # -k 0: report every compile error of a first Linux build at once.
        run: cmake --build build --target SpectroCraft --parallel "$(nproc)" -- -k 0

      - name: Unit tests (parallel shards, virtual display)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -j "$(nproc)" --output-on-failure

      - name: Package app (Linux x64)
        if: success()
        run: tar -czf SpectroCraft-linux-x64.tar.gz -C build/src/SpectroCraft_artefacts/Debug SpectroCraft

      - name: Upload app (Linux x64, Debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpectroCraft-linux-x64
          path: SpectroCraft-linux-x64.tar.gz
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-debug
          path: build/Testing/Temporary/
          if-no-files-found: ignore
