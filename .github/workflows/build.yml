# Build + unit tests: one AI build per platform (-DSPECTRO_ENABLE_AI=ON).
# The app artifacts are named SpectroCraft-<os> on main and
# SpectroCraft-<os>-<branch> elsewhere (e.g. the Video window branch:
# SpectroCraft-windows-x64-video-viewer), so a feature build never passes
# for a main one.
# Windows uses the vendored runtime DLLs; macOS / Linux fetch the pinned
# OpenVINO 2024.6 archive and whisper.cpp b5454 at configure time
# (cmake/ScAiRuntimes.cmake). Every other dependency (JUCE, SoXR, SoundTouch,
# FFmpeg) is vendored under extern/. Model weights are downloaded by the tests
# on first use and cached between runs.
#
# Only the app target is built: it embeds the unit suite (--run-unit-tests,
# which is what ctest runs) and depends on the fake recorder plugin the
# recording tests load (tests/CMakeLists.txt). The console SpectroCraftTests
# target would compile UnitTests.cpp and src/ a second time for nothing.
#
# ctest runs the suite as SC_TEST_SHARDS parallel processes (one per CPU of
# the configuring machine, see tests/CMakeLists.txt); -j lets them overlap.
name: build

on:
  push:
    branches: [main, audit-fixes-2026-11]
  pull_request:
  workflow_dispatch:

# One run per ref (branch pushes to main / audit-fixes-2026-11 and PRs both
# trigger), a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Windows with the AI features (OpenVINO noise suppression, whisper.cpp
  # transcription): the configuration shipped by the GitHub release. The runtime
  # DLLs are vendored there and copied next to the exe; model weights are not
  # shipped - the app downloads them on first use (tests download them into
  # %APPDATA%/SpectroCraft/models, cached between runs).
  windows-ai:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds of a branch other than main publish their own artifacts
      # (SpectroCraft-<os>-<branch>, e.g. -video-viewer), kept apart from the
      # main builds. Characters artifact names refuse become '-'.
      - name: Artifact name suffix
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref="${ref//[^A-Za-z0-9._-]/-}"
          if [ "$ref" = main ]; then suffix=""; else suffix="-$ref"; fi
          echo "SC_ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "artifact suffix: '$suffix'"

      - name: Cache AI model weights
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\SpectroCraft\models
          key: sc-models-${{ hashFiles('src/AI/ModelManager.cpp') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DSPECTRO_ENABLE_AI=ON

      # sc_wasapi_recorder is not a dependency of the app target, so it must
      # be requested explicitly or <exe>/recorders/ ends up empty in the zip.
      # spectrocraft-updater likewise: it is copied into <exe>/SpectroCraft/
      # (updater/CMakeLists.txt) and is part of the archive.
      - name: Build (Release, app + WASAPI recorder plugin + updater)
        run: cmake --build build --config Release --target SpectroCraft --target sc_wasapi_recorder --target spectrocraft-updater --parallel

      # -j 1: shards in turn, so two processes never download the same model
      # file at the same time.
      - name: Unit tests (shards in turn, AI tests included)
        run: ctest --test-dir build -C Release -j 1 --output-on-failure

      # Real audio.cpp CLI (cpu zip): catalogue install, FlashSR super
      # resolution and htdemucs stem separation (~70 MB downloaded).
      - name: audio.cpp end to end (real CLI)
        timeout-minutes: 30
        run: python tools/acpp_e2e.py --exe build/src/SpectroCraft_artefacts/Release/SpectroCraft.exe --variant cpu --backend cpu

      # The archive payload is assembled on purpose instead of zipping the whole
      # build folder: the update manifest below must describe exactly the files
      # the archive contains, and the build folder also holds test logs and
      # probe executables that are not part of a release.
      - name: Assemble the Windows archive payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "build/src/SpectroCraft_artefacts/Release"
          $out = "build/release-payload"
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath "$src/SpectroCraft.exe" -Destination "$out/SpectroCraft.exe"
          Copy-Item -LiteralPath "$src/SpectroCraft" -Destination "$out/SpectroCraft" -Recurse
          Copy-Item -LiteralPath "$src/recorders" -Destination "$out/recorders" -Recurse
          Get-ChildItem -LiteralPath $out -Recurse -Filter *.pdb | Remove-Item -Force
          if (-not (Test-Path -LiteralPath "$out/SpectroCraft/spectrocraft-updater.exe")) {
            throw "spectrocraft-updater.exe is missing from the payload"
          }
          Write-Output "payload:"
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName }

      # PowerShell rather than bash: MSYS resolves a bare "SpectroCraft" to the
      # SpectroCraft.exe next to it, so copying the SpectroCraft/ folder after
      # the exe fails with "cannot overwrite non-directory".

      # update-manifest.json + its Ed25519 signature: the app verifies the
      # signature with the key built into it (include/Updates.h) before it
      # unpacks anything (docs/updates.md). gh_release*.py uploads both files
      # as release assets, next to the archive.
      - name: Update manifest (generate + sign)
        shell: bash
        run: |
          set -euo pipefail
          # `python`, not `python3`: the Windows runner's Python is reachable as
          # python (the macOS / Linux jobs use python3).
          python tools/make_update_manifest.py \
            --dir build/release-payload \
            --out build/update-manifest.json \
            --version-file build/generated/SC_VERSION.txt
          build/src/SpectroCraft_artefacts/Release/SpectroCraft/spectrocraft-updater.exe \
            --sign tools/updates/ed25519.key build/update-manifest.json build/update-manifest.json.sig
          # The same check the app makes before it unpacks anything. The unit
          # test (tests/regression/updates.inc) additionally asserts that this
          # key file's public key is the one built into the app.
          build/src/SpectroCraft_artefacts/Release/SpectroCraft/spectrocraft-updater.exe \
            --verify tools/updates/ed25519.key build/update-manifest.json build/update-manifest.json.sig

      - name: Upload app (Windows x64, Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # SpectroCraft.exe + SpectroCraft/ (OpenVINO / whisper.cpp / FFmpeg
          # DLLs + spectrocraft-updater.exe) + recorders/.
          name: SpectroCraft-windows-x64${{ env.SC_ARTIFACT_SUFFIX }}
          path: build/release-payload/
          retention-days: 30

      - name: Upload update manifest (Windows x64)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest-windows${{ env.SC_ARTIFACT_SUFFIX }}
          path: |
            build/update-manifest.json
            build/update-manifest.json.sig
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows${{ env.SC_ARTIFACT_SUFFIX }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore


  # macOS with the AI features: OpenVINO 2024.6 (official arm64 archive) and
  # whisper.cpp b5454 (built from source, Release) are fetched and verified at
  # configure time and shipped in SpectroCraft.app/Contents/Frameworks. The
  # runtime archives and the model weights the tests download are cached.
  # Shards run in parallel: each download goes to a per-process .part file
  # and is renamed into place atomically (src/AI/ModelManager.cpp).
  macos-ai:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds of a branch other than main publish their own artifacts
      # (SpectroCraft-<os>-<branch>, e.g. -video-viewer), kept apart from the
      # main builds. Characters artifact names refuse become '-'.
      - name: Artifact name suffix
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref="${ref//[^A-Za-z0-9._-]/-}"
          if [ "$ref" = main ]; then suffix=""; else suffix="-$ref"; fi
          echo "SC_ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "artifact suffix: '$suffix'"

      - name: Cache AI runtime archives (OpenVINO, whisper.cpp sources)
        uses: actions/cache@v4
        with:
          path: ai-downloads
          key: sc-ai-runtimes-macos-arm64-${{ hashFiles('cmake/ScAiRuntimes.cmake') }}

      - name: Cache AI model weights
        uses: actions/cache@v4
        with:
          path: test-models
          key: sc-models-posix-${{ hashFiles('src/AI/ModelManager.cpp') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSPECTRO_ENABLE_AI=ON
          -DSPECTRO_ENABLE_FFMPEG=OFF
          -DSC_AI_DOWNLOAD_DIR="$GITHUB_WORKSPACE/ai-downloads"
          -DSC_TEST_MODELS_DIR="$GITHUB_WORKSPACE/test-models"

      - name: Build (Debug, app + fake recorder plugin + AI runtimes)
        run: cmake --build build --target SpectroCraft --parallel "$(sysctl -n hw.ncpu)"

      # Every library in the bundle must resolve inside the bundle: no
      # reference to the build tree, the runner or Homebrew.
      - name: Check the bundled AI runtime
        run: |
          app=build/src/SpectroCraft_artefacts/Debug/SpectroCraft.app/Contents
          ls -la "$app/Frameworks"
          bad=0
          for f in "$app/MacOS/SpectroCraft" "$app"/Frameworks/*; do
            [ -L "$f" ] && continue
            if otool -L "$f" | tail -n +2 | grep -v -E '@rpath/|/usr/lib/|/System/Library/'; then
              echo "::error::$f links outside the bundle"; bad=1
            fi
            if otool -l "$f" | grep -A2 LC_RPATH | grep ' path ' | grep -v -E '@(loader|executable)_path'; then
              echo "::error::$f has an absolute run path"; bad=1
            fi
          done
          exit $bad

      - name: Unit tests (parallel shards, AI tests included)
        run: ctest --test-dir build -j "$(sysctl -n hw.ncpu)" --output-on-failure

      # Real audio.cpp CLI (Metal build, cpu backend: a usable GPU is not
      # guaranteed on hosted runners): catalogue install of the .tar.gz,
      # FlashSR super resolution and htdemucs stem separation (~75 MB).
      - name: audio.cpp end to end (real CLI)
        timeout-minutes: 30
        run: python3 tools/acpp_e2e.py --exe build/src/SpectroCraft_artefacts/Debug/SpectroCraft.app/Contents/MacOS/SpectroCraft --variant metal --backend cpu

      # tar first: upload-artifact zips drop the executable bit and symlinks.
      - name: Package app (macOS arm64)
        if: success()
        run: tar -czf SpectroCraft-macos-arm64.tar.gz -C build/src/SpectroCraft_artefacts/Debug SpectroCraft.app

      - name: Upload app (macOS arm64, Debug, unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpectroCraft-macos-arm64${{ env.SC_ARTIFACT_SUFFIX }}
          path: SpectroCraft-macos-arm64.tar.gz
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-macos${{ env.SC_ARTIFACT_SUFFIX }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore


  # Linux with the AI features: OpenVINO 2024.6 (official Ubuntu 24.04 x86_64
  # archive) and whisper.cpp b5454 (built from source, Release, one ggml CPU
  # backend per x86 micro-architecture) are fetched at configure time and
  # copied next to the executable (RPATH $ORIGIN). Model downloads go through
  # JUCE's libcurl backend (libcurl4-openssl-dev).
  linux-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds of a branch other than main publish their own artifacts
      # (SpectroCraft-<os>-<branch>, e.g. -video-viewer), kept apart from the
      # main builds. Characters artifact names refuse become '-'.
      - name: Artifact name suffix
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref="${ref//[^A-Za-z0-9._-]/-}"
          if [ "$ref" = main ]; then suffix=""; else suffix="-$ref"; fi
          echo "SC_ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "artifact suffix: '$suffix'"

      - name: Install JUCE dependencies (+ libcurl for the model downloads)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config patchelf \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libegl-dev libgl-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Cache AI runtime archives (OpenVINO, whisper.cpp sources)
        uses: actions/cache@v4
        with:
          path: ai-downloads
          key: sc-ai-runtimes-linux-x64-${{ hashFiles('cmake/ScAiRuntimes.cmake') }}

      - name: Cache AI model weights
        uses: actions/cache@v4
        with:
          path: test-models
          key: sc-models-posix-${{ hashFiles('src/AI/ModelManager.cpp') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSPECTRO_ENABLE_AI=ON
          -DSPECTRO_ENABLE_FFMPEG=OFF
          -DSC_AI_DOWNLOAD_DIR="$GITHUB_WORKSPACE/ai-downloads"
          -DSC_TEST_MODELS_DIR="$GITHUB_WORKSPACE/test-models"

      - name: Build (Debug, app + fake recorder plugin + AI runtimes)
        run: cmake --build build --target SpectroCraft --parallel "$(nproc)" -- -k 0

      # Every library must resolve from the executable's folder: none missing,
      # none taken from the build tree, run paths limited to $ORIGIN.
      - name: Check the bundled AI runtime
        run: |
          dir=build/src/SpectroCraft_artefacts/Debug
          here=$(cd "$dir" && pwd)
          ls -la "$dir"
          bad=0
          for f in "$dir/SpectroCraft" "$dir"/lib*.so*; do
            [ -L "$f" ] && continue
            if ldd "$f" | grep 'not found'; then
              echo "::error::$f: unresolved dependency"; bad=1
            fi
            outside=$(ldd "$f" | awk '/=>/ {print $3}' | grep -v -E "^($here/|/lib/|/usr/lib/|/lib64/)" || true)
            if [ -n "$outside" ]; then
              echo "::error::$f resolves libraries outside its folder: $outside"; bad=1
            fi
            if readelf -d "$f" | grep -E 'R(UN)?PATH' | grep -v -E '\[\$ORIGIN\]'; then
              echo "::error::$f: run path other than \$ORIGIN"; bad=1
            fi
          done
          exit $bad

      - name: Unit tests (parallel shards, AI tests included, virtual display)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -j "$(nproc)" --output-on-failure

      # Real audio.cpp CLI (cpu .tar.gz with its libggml*.so): catalogue
      # install, FlashSR super resolution and htdemucs stem separation
      # (~105 MB downloaded).
      - name: audio.cpp end to end (real CLI)
        timeout-minutes: 30
        run: xvfb-run -a python3 tools/acpp_e2e.py --exe build/src/SpectroCraft_artefacts/Debug/SpectroCraft --variant cpu --backend cpu

      # The executable needs the libraries next to it: ship the whole folder.
      - name: Package app (Linux x64)
        if: success()
        run: tar -czf SpectroCraft-linux-x64.tar.gz -C build/src/SpectroCraft_artefacts Debug

      - name: Upload app (Linux x64, Debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpectroCraft-linux-x64${{ env.SC_ARTIFACT_SUFFIX }}
          path: SpectroCraft-linux-x64.tar.gz
          retention-days: 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux${{ env.SC_ARTIFACT_SUFFIX }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Python MCP adapter (tools/mcp, AI control lot 2): pytest against a fake
  # NDJSON server and a fake executable. No C++ build; test_real_exe.py skips
  # (no SPECTROCRAFT_EXE).
  mcp-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the adapter and its test dependencies
        run: pip install -e "tools/mcp[test]"

      - name: pytest
        run: pytest tools/mcp/tests -ra
