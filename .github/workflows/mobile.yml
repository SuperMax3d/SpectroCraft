# SpectroCraft Mobile (issue #73): unit tests, Android APK / AAB, iOS build.
#
# Always: the mobile unit tests (macOS), a release APK (signed with the
# upload key when the keystore secrets are set, otherwise with the debug key:
# installable by hand) and an iOS simulator build.
#
# With secrets (see mobile/README.md, "Store builds"):
#   Android: SC_ANDROID_KEYSTORE_BASE64, SC_ANDROID_KEYSTORE_PASSWORD,
#            SC_ANDROID_KEY_ALIAS, SC_ANDROID_KEY_PASSWORD -> signed APK + AAB;
#            SC_PLAY_SERVICE_ACCOUNT_JSON -> the AAB goes to Google Play's
#            internal testing track (manual runs and main only).
#   iOS:     SC_APPLE_TEAM_ID, SC_APPSTORE_KEY_ID, SC_APPSTORE_ISSUER_ID,
#            SC_APPSTORE_KEY_P8 -> archive signed by Xcode (automatic signing
#            through the App Store Connect API key) and uploaded to TestFlight
#            (manual runs and main only; any push when the repository variable
#            SC_MOBILE_UPLOAD is "true").
# The bundle / application id comes from the repository variable
# SC_MOBILE_BUNDLE_ID (default com.spectrocraft.mobile).
#
# Crash reports and statistics (mobile/src/Telemetry.h) are compiled in only
# when the repository variables SC_SENTRY_DSN / SC_POSTHOG_KEY (and optionally
# SC_POSTHOG_HOST) are set - so pull-request builds from forks send nothing.
# With the secret SC_SENTRY_AUTH_TOKEN and the variables SC_SENTRY_ORG /
# SC_SENTRY_PROJECT, the debug symbols are uploaded to Sentry so native crashes
# show file and line.
name: mobile

on:
  push:
    branches: [main, "mobile-*"]   # mobile-* : work branches on a fork
    paths:
      - "mobile/**"
      - "src/**"
      - "include/**"
      - "extern/JUCE/**"
      - "extern/soxr/**"
      - "extern/soundtouch/**"
      - "resources/fonts/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "include/**"
      - "extern/JUCE/**"
      - "extern/soxr/**"
      - "extern/soundtouch/**"
      - "resources/fonts/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight / Google Play internal testing (needs the secrets)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_ID: ${{ vars.SC_MOBILE_BUNDLE_ID || 'com.spectrocraft.mobile' }}
  SENTRY_DSN: ${{ vars.SC_SENTRY_DSN }}
  POSTHOG_KEY: ${{ vars.SC_POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.SC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
  # Store uploads: manual runs with "upload", pushes to main, and pushes to any
  # branch of a repository whose variable SC_MOBILE_UPLOAD is "true" (a fork
  # building test versions from its mobile-* branches).
  UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || vars.SC_MOBILE_UPLOAD == 'true')) }}

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (tests only)
        run: cmake -S mobile -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DSC_MOBILE_APP=OFF
      - name: Build
        run: cmake --build build-tests --target SpectroCraftMobileTests --parallel "$(sysctl -n hw.ncpu)"
      - name: Run
        run: build-tests/SpectroCraftMobileTests_artefacts/Release/SpectroCraftMobileTests

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Host packages for juceaide
        # JUCE builds its helper tool (juceaide) for the Linux host first; it
        # needs the same headers as the desktop Linux build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype-dev libfontconfig1-dev libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev
      - name: Pick the installed NDK
        run: |
          ndk="${ANDROID_NDK_HOME:-}"
          if [ -z "$ndk" ]; then ndk="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"; fi
          echo "NDK_VERSION=$(basename "$ndk")" >> "$GITHUB_ENV"
          echo "NDK: $ndk"
      - name: Upload keystore
        env:
          KS: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SC_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Build APK and AAB
        env:
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          SC_KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
        run: |
          tasks="assembleRelease"
          if [ "${SIGNED:-}" = "1" ]; then tasks="$tasks bundleRelease"; fi
          gradle -p mobile/android $tasks --stacktrace \
            -PappId="$BUNDLE_ID" -PversionCode="${{ github.run_number }}" -PndkVersion="$NDK_VERSION" \
            -PsentryDsn="$SENTRY_DSN" -PposthogKey="$POSTHOG_KEY" -PposthogHost="$POSTHOG_HOST"
      - name: Collect
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/*.apk out/SpectroCraftMobile-${{ github.run_number }}.apk
          if [ -d mobile/android/app/build/outputs/bundle/release ]; then
            cp mobile/android/app/build/outputs/bundle/release/*.aab out/SpectroCraftMobile-${{ github.run_number }}.aab
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SpectroCraftMobile-android
          path: out/
      - name: Sentry debug symbols (Android)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SC_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SC_SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SC_SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_DSN" ]; then echo "No Sentry token or DSN: skipped."; exit 0; fi
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.8.2 sh
          # The unstripped libjuce_jni.so (the APK ships the stripped one).
          sentry-cli debug-files upload --include-sources mobile/android/app/build/intermediates/merged_native_libs
      - name: Google Play (internal testing)
        if: env.UPLOAD == 'true' && env.SIGNED == '1'
        env:
          PLAY_JSON: ${{ secrets.SC_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "No SC_PLAY_SERVICE_ACCOUNT_JSON: skipped."; exit 0; fi
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_JSON_FILE=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
      - uses: r0adkll/upload-google-play@v1
        if: env.UPLOAD == 'true' && env.SIGNED == '1' && env.PLAY_JSON_FILE != ''
        with:
          serviceAccountJson: ${{ env.PLAY_JSON_FILE }}
          packageName: ${{ env.BUNDLE_ID }}
          releaseFiles: out/*.aab
          track: internal
          status: completed

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Xcode, iOS)
        env:
          TEAM: ${{ secrets.SC_APPLE_TEAM_ID }}
        run: |
          cmake -S mobile -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DSC_SENTRY_DSN="$SENTRY_DSN" -DSC_POSTHOG_KEY="$POSTHOG_KEY" -DSC_POSTHOG_HOST="$POSTHOG_HOST" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DSC_MOBILE_BUNDLE_ID="$BUNDLE_ID" \
            -DSC_MOBILE_BUILD_NUMBER="${{ github.run_number }}" \
            ${TEAM:+-DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=$TEAM}
      - name: Build for the simulator
        run: |
          xcodebuild -project build-ios/SpectroCraftMobile.xcodeproj -scheme SpectroCraftMobile \
            -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build > build-ios/xcodebuild.log 2>&1 \
            || { grep -E -A4 "error:" build-ios/xcodebuild.log | head -150; tail -n 20 build-ios/xcodebuild.log; exit 1; }
          tail -n 5 build-ios/xcodebuild.log
          app="$(find build-ios -type d -name 'SpectroCraft.app' -not -path '*.dSYM*' | head -1)"
          echo "Simulator app: $app"
          [ -n "$app" ] || { find build-ios -type d -name '*.app' | head; exit 1; }
          mkdir -p out && ditto -c -k --keepParent "$app" out/SpectroCraftMobile-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpectroCraftMobile-ios-simulator
          path: out/
      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          TEAM: ${{ secrets.SC_APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.SC_APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.SC_APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.SC_APPSTORE_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY_P8" ]; then
            echo "App Store Connect secrets missing: skipped."; exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # The app must exist in App Store Connect (it cannot be created through
          # the API): without it, say so instead of failing the upload.
          token="$(ruby -ropenssl -rjson -rbase64 -e '
            key = OpenSSL::PKey::EC.new(File.read(ARGV[0]))
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            h = b64.(JSON.generate({ alg: "ES256", kid: ARGV[1], typ: "JWT" }))
            now = Time.now.to_i
            p = b64.(JSON.generate({ iss: ARGV[2], iat: now, exp: now + 900, aud: "appstoreconnect-v1" }))
            der = key.sign(OpenSSL::Digest::SHA256.new, "#{h}.#{p}")
            raw = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\x00") }.join
            puts "#{h}.#{p}.#{b64.(raw)}"' "$key" "$KEY_ID" "$ISSUER")"
          apps="$(curl -s -H "Authorization: Bearer $token" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=$BUNDLE_ID&fields%5Bapps%5D=bundleId")"
          if ! python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("data") else 1)' <<< "$apps"; then
            echo "::warning::No app with bundle id $BUNDLE_ID in App Store Connect yet: create it (My Apps > + > New App), then push again. Upload skipped."
            exit 0
          fi
          # Archive unsigned, then let the export sign for App Store distribution
          # (cloud-managed certificate through the API key). Signing the archive
          # itself would ask for a development profile, which needs a registered
          # device.
          xcodebuild -project build-ios/SpectroCraftMobile.xcodeproj -scheme SpectroCraftMobile \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath build-ios/SpectroCraftMobile.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > build-ios/archive.log 2>&1 \
            || { grep -E -A4 "error:" build-ios/archive.log | head -80; tail -n 20 build-ios/archive.log; exit 1; }
          tail -n 3 build-ios/archive.log
          cat > build-ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build-ios/SpectroCraftMobile.xcarchive \
            -exportOptionsPlist build-ios/ExportOptions.plist -exportPath build-ios/export "${auth[@]}"
      - name: Sentry debug symbols (iOS)
        if: env.UPLOAD == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SC_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SC_SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SC_SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_DSN" ] || [ ! -d build-ios/SpectroCraftMobile.xcarchive/dSYMs ]; then
            echo "No Sentry token, DSN or archive: skipped."; exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.8.2 sh
          sentry-cli debug-files upload --include-sources build-ios/SpectroCraftMobile.xcarchive/dSYMs
