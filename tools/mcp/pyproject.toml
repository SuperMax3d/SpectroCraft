[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrocraft-mcp"
version = "0.1.0"
description = "MCP adapter that lets Claude Code drive an open SpectroCraft (TCP loopback NDJSON control protocol)"
requires-python = ">=3.11"
# license: AGPL-3.0, see the repository LICENSE file
# mcp 2.x renamed FastMCP to MCPServer and reworked the low-level server API;
# this adapter is written against the 1.x API (FastMCP + Context.report_progress).
# 1.6 is the oldest release the test suite was run against (1.2-1.5 do not import with current pydantic).
dependencies = ["mcp>=1.6,<2"]

[project.optional-dependencies]
# jsonschema is already pulled in by recent mcp 1.x releases; listed explicitly
# because the tests validate every generated inputSchema with it.
test = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
spectrocraft-mcp = "spectrocraft_mcp.server:main"

[tool.setuptools]
packages = ["spectrocraft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
